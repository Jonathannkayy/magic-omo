name: Upstream compatibility
on:
  schedule:
    - cron: '41 5 * * *'   # daily: upstream can break the contract with no change here
  workflow_dispatch:
  pull_request:
    paths:
      - 'compat.json'
      - 'vendor/**'
      - 'scripts/contract-check.js'
      - '.github/workflows/upstream-compat.yml'
permissions:
  contents: read
concurrency:
  group: upstream-compat-${{ github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    name: build matrix from compat.json
    runs-on: ubuntu-latest
    outputs:
      combos: ${{ steps.plan.outputs.combos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - id: plan
        name: Verified pins x (verified omo rows + latest)
        run: |
          node -e '
            const c = require("./compat.json");
            const out = [];
            for (const pin of c.pins) {
              const rows = c.matrix.filter((r) => r.magic_context === pin.magic_context);
              if (!rows.some((r) => r.status === "verified")) continue;   // only verified pins are gating
              for (const r of rows.filter((r) => r.status === "verified")) {
                out.push({ name: `mc ${pin.magic_context} x omo ${r.omo}`, mc: pin.magic_context, omo: r.omo, gating: true });
              }
              out.push({ name: `mc ${pin.magic_context} x omo latest`, mc: pin.magic_context, omo: "latest", gating: false });
            }
            if (!out.length) {
              // An empty matrix makes GitHub skip the contract job and the run stays green.
              console.log("::error file=compat.json::no verified pin/omo combination in compat.json: nothing to contract-check");
              process.exit(1);
            }
            console.log(`${out.length} combination(s):\n${out.map((o) => `  ${o.name}${o.gating ? "" : " (advisory)"}`).join("\n")}`);
            require("node:fs").appendFileSync(process.env.GITHUB_OUTPUT, `combos=${JSON.stringify(out)}\n`);
          '
  contract:
    name: ${{ matrix.combo.name }}
    needs: plan
    runs-on: ubuntu-latest
    continue-on-error: ${{ !matrix.combo.gating }}
    strategy:
      fail-fast: false
      matrix:
        combo: ${{ fromJSON(needs.plan.outputs.combos) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Contract check
        id: check
        env:   # passed via env, never expanded into the script (template injection)
          OMO: ${{ matrix.combo.omo }}
          MC: ${{ matrix.combo.mc }}
        run: |
          set -o pipefail
          node scripts/contract-check.js --omo-ai "$OMO" --mc "$MC" | tee "contract-${MC}-${OMO}.json"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: contract-${{ matrix.combo.mc }}-${{ matrix.combo.omo }}
          path: 'contract-*.json'
          if-no-files-found: warn
