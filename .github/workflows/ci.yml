name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * *'   # daily: catches upstream/runner drift with no code change
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: for f in bin/*.js src/*.js scripts/*.js test/*.js; do node --check "$f"; done
      - name: Unit tests
        run: npm test
      - name: Compatibility doc drift
        run: npm run compat:check
      - name: Package contents
        run: npm pack --dry-run
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install devDependencies (eslint)
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: ESLint
        run: npm run lint
      - name: ShellCheck
        run: shellcheck test/e2e/*.sh
      - name: bash -n
        run: bash -n test/e2e/sandbox.sh
